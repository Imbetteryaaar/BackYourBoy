# Render Blueprint — deploys the Back Your Boy backend (FastAPI + WebSockets).
# In the Render dashboard: New > Blueprint, point it at this repo.
services:
  - type: web
    name: back-your-boy-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: ALLOWED_ORIGINS
        sync: false   # set this to your Vercel URL after the frontend deploys
